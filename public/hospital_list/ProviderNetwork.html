  function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render() {
    const term = q.value.trim().toLowerCase();
    const st = stateFilter.value;
    let shown = 0;
    const rows = [];
    for (const r of DATA) {
      if (st && r.state !== st) continue;
      if (term && !(r.name.toLowerCase().includes(term) || r.city.toLowerCase().includes(term) || r.pin.includes(term))) continue;
      shown++;
      rows.push(`<tr>
        <td class="name">${esc(r.name)}</td>
        <td class="addr">${esc(r.address)}</td>
        <td>${esc(r.city)}</td>
        <td>${esc(r.state)}</td>
        <td>${esc(r.pin)}</td>
        <td>${esc(r.phone)}</td>
        <td>${esc(r.type)}</td>
        <td>${r.category ? `<span class="pill">${esc(r.category)}</span>` : ''}</td>
      </tr>`);
    }
    tbody.innerHTML = rows.join('');
    countEl.innerHTML = `<b>${shown}</b> of ${DATA.length} hospitals`;
    emptyEl.style.display = shown === 0 ? 'block' : 'none';
  }

  q.addEventListener('input', render);
  stateFilter.addEventListener('change', render);
  render();
</script>
</body>
</html>
